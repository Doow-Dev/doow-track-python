steps:
  test:
    image: python:3.11-slim
    commands:
      - pip install -e ".[dev]"
      - ruff check src/ || true
      - pytest tests/ -v

  build:
    image: python:3.11-slim
    commands:
      - pip install build
      - python -m build
    when:
      event: tag

  publish-pypi:
    image: python:3.11-slim
    commands:
      - pip install twine
      - twine upload dist/* -u __token__ -p $PYPI_TOKEN
    secrets: [pypi_token]
    when:
      event: tag

  build-docker:
    image: docker:dind
    commands:
      - docker build -t ghcr.io/doow-dev/doow-track-python:${CI_COMMIT_TAG:-latest} .
      - docker tag ghcr.io/doow-dev/doow-track-python:${CI_COMMIT_TAG:-latest} ghcr.io/doow-dev/doow-track-python:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      event: tag

  push-docker:
    image: docker:dind
    commands:
      - echo $GHCR_TOKEN | docker login ghcr.io -u doow-dev --password-stdin
      - docker push ghcr.io/doow-dev/doow-track-python:${CI_COMMIT_TAG}
      - docker push ghcr.io/doow-dev/doow-track-python:latest
    secrets: [ghcr_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      event: tag
